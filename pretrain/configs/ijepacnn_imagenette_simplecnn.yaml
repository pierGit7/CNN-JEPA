# CNN-JEPA pretraining of a small 3-layer CNN (simple_cnn) on Imagenette, on one GPU (e.g. a university HPC node).
# Run from the repo root:
#   PYTHONPATH=. python pretrain/train_ijepacnn.py --config-name ijepacnn_imagenette_simplecnn.yaml
# Any value can be overridden on the command line, e.g.
#   ... data.root=/path/to/datasets trainer.max_epochs=2 trainer.precision=16

seed: 42

name: "CNN-JEPA_{data_dataset_name}_{backbone_name}_predL{predictor_n_layers}K{predictor_kernel_size}_Mask{mask_strategy}_lr{optimizer_lr}_bs{optimizer_batch_size}"
artifacts_root: "artifacts/pretrain_lightly/ijepacnn"   # "_<dataset_name>" is appended automatically

# ---------------------------------------------------------------- input
data:
  dataset_name: "imagenette"  # image size (224) and class count come from trainer_common.py
  root: "./datasets"          # images are read from <root>/imagenette/imagenette2-160/{train,val}; on the HPC pass data.root=/your/path
  imagenette_size: "160px"    # which Imagenette download you have: "160px" | "320px" | "full"
  num_workers: 8              # parallel image-loading processes (match the CPUs you request from SLURM)

# ---------------------------------------------------------------- encoder
backbone:
  name: "simple_cnn"          # registered in models/custom.py
  pretrained_weights: null
  kwargs:
    global_pool: ''           # keep the feature map (B, C, h, w); CNN-JEPA predicts per grid cell
    dims: [32, 64, 128]       # channels per layer; 3 entries = 3 layers -> 224px input gives a 28x28 grid
    kernel_size: 3

# ---------------------------------------------------------------- JEPA parts
mask:
  strategy: "mixed"           # multi-block | random | mixed
  mutli_block_kwargs:         # (sic: the code expects this spelling)
    aspect_ratio: [0.75, 1.5]
    enc_mask_scale: [1.0, 1.0]
    min_keep: 5
    num_enc_blocks: 1
    num_pred_blocks: 4
    pred_mask_scale: [0.15, 0.2]
  mixed_mutli_block_ratio: 0.75   # share of batches using multi-block masks (the rest use random masks)
mask_ratio: 0.6               # fraction of grid cells hidden by the random mask

predictor:
  n_layers: 3
  kernel_size: 3
  dw_sep_conv: True
use_projection_head: False

# ---------------------------------------------------------------- optimisation
optimizer:
  batch_size: 128            # same as the paper
  lr: 0.01
  weight_decay: 0.01
  cosine_warmpup_sched: True  # (sic) linear warmup then cosine decay
  lr_warmup_epochs: 10
  exclude_norm_and_bias_from_wd: False
  wd_schedule: False

trainer:
  max_epochs: 100
  devices: 1
  accelerator: "gpu"
  precision: "bf16"           # needs an Ampere+ GPU (A100, A40, RTX 30xx/40xx...). On V100/older use 16; on a Mac use 32 with accelerator: "auto"
  accumulate_grad_batches: null
  overfit_batches: 0.0

# ---------------------------------------------------------------- logging
wandb: true                   # set to false to disable W&B logging (metrics are then only printed)

# disable hydra outputs
hydra:
  output_subdir: null
  run:
    dir: .
